# Niveles de la verificacion local del motor por ruta cambiada
# (docs/features/motor-local/README.md). `make motor-local` y el control
# `motor-local` de CI leen este archivo; CI usa siempre la copia de la rama base.
#
# Cada ruta cambiada toma los niveles de la PRIMERA regla que coincide. Una ruta
# sin regla exige todos los niveles, para que una carpeta nueva no evite la
# corrida. El PR exige la union de los niveles de sus rutas.
# Patrones: `*` no cruza `/`; `**` cruza carpetas.

repo = "pred-engine"

[[reglas]]
niveles = []
rutas = [
  "docs/**",
  "**/*.md",
  "LICENSE",
  ".gitignore",
  ".env.example",
  ".pre-commit-config.yaml",
  "data/**/.gitkeep",
  "tests/**",
  ".github/**",
]

# Escribe las tablas M3 que lee la plataforma.
[[reglas]]
niveles = ["muestra22", "plataforma"]
rutas = ["src/pred_engine/forecasting/persistencia_evidencia/**"]

# M0, telemetria, prueba integrada, analisis y comandos de desarrollo.
[[reglas]]
niveles = ["humo"]
rutas = [
  "src/pred_engine/aumentacion/**",
  "src/pred_engine/run_chart.py",
  "src/pred_engine/run_telemetry.py",
  "src/pred_engine/verify.py",
  "src/pred_engine/comun/llm/**",
  "src/pred_engine/analisis/**",
  "Makefile",
]

# L1-L4 y el entorno del motor.
[[reglas]]
niveles = ["muestra22"]
rutas = [
  "src/pred_engine/**",
  "pyproject.toml",
  "uv.lock",
  ".python-version",
]
