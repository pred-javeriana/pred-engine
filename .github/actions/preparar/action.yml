name: Preparar entorno
description: Instala uv con cache, Python 3.12 y las dependencias congeladas de uv.lock.

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: "0.11.x"
        python-version: "3.12"
        enable-cache: true

    - name: Instalar dependencias
      shell: bash
      run: uv sync --frozen --extra dev
