name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lock:
    name: uv.lock al dia con pyproject.toml
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.x"
      - name: uv lock --check
        run: uv lock --check

  lint:
    name: Lint (ruff check)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/preparar
      - name: ruff check
        run: uv run --no-sync ruff check --output-format=github .

  format:
    name: Formato (ruff format)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/preparar
      - name: ruff format --diff
        run: uv run --no-sync ruff format --diff .

  types:
    name: Tipos (pyright)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/preparar
      - name: pyright
        run: uv run --no-sync pyright
        env:
          PYRIGHT_PYTHON_IGNORE_WARNINGS: "1"

  tests:
    name: Pruebas y cobertura minima
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/preparar
      - name: pytest -m "not slow" (cobertura >= 80 %)
        run: uv run --no-sync pytest -m "not slow"

  slow-tests:
    name: Pruebas lentas (benchmarks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/preparar
      - name: pytest -m slow
        run: uv run --no-sync pytest -m slow --no-cov

  self-check:
    name: Prueba integrada (python -m pred_engine.verify)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/preparar
      - name: python -m pred_engine.verify
        run: uv run --no-sync python -m pred_engine.verify

  run:
    name: Corrida M0-M2 de punta a punta (pred-engine run)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUN_DIR: data/runs/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/preparar
      - name: Obtener plataforma con esquema base publicado
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pred-javeriana/pred-platform
          ref: 7e3b327ef5ebf10e9bacf7e2a98ef95cf210cbdd
          path: .ci-platform
          persist-credentials: false

      - name: Crear base central con el migrador de plataforma
        env:
          PYTHONPATH: .ci-platform/src
        run: .venv/bin/python -m pred_platform.dal.migrate --db data/pred.db

      - name: pred-engine run con tests/fixtures/semilla_inventario.csv
        run: |
          code=0
          uv run --no-sync pred-engine run \
            --seed-csv tests/fixtures/semilla_inventario.csv \
            --data-root data --db-path data/pred.db --run-id ci --workers 2 \
            --m0-metodo mbb-directo --m0-n-series 1 --m0-minimo-filas 0 \
            --m0-columna sku_id=Item_ID --m0-columna timestamp=Date \
            --m0-columna demand_qty=Avg_Usage_Per_Day \
            --m0-columna lead_time_days=Restock_Lead_Time \
            > "$RUNNER_TEMP/corrida.log" || code=$?
          tail -n 1 "$RUNNER_TEMP/corrida.log"
          if [ "$code" != 0 ] && [ "$code" != 8 ]; then
            tail -n 40 "$RUNNER_TEMP/corrida.log"
            echo "::error title=pred-engine run::codigo de salida $code; se espera 0 (M3 publicada) u 8 (publicada con fallos aislados)"
            exit 1
          fi

      - name: pred-engine telemetry
        run: uv run --no-sync pred-engine telemetry "$RUN_DIR"

      - name: Verificar artefactos y publicacion central
        run: uv run --no-sync python .github/scripts/verificar_corrida.py "$RUN_DIR" data/pred.db

      - name: Publicar artefactos de la corrida
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corrida-ci
          path: |
            ${{ env.RUN_DIR }}/*.json
            ${{ env.RUN_DIR }}/*.jsonl
            ${{ env.RUN_DIR }}/*.parquet
            ${{ env.RUN_DIR }}/*.svg
            ${{ env.RUN_DIR }}/m3/
            data/pred.db
          retention-days: 7
          if-no-files-found: ignore
