[project]
name = "pred-engine"
version = "0.1.0"
description = "PRED analytical engine: demand-forecasting library for Plataforma de Evaluacion y Recomendacion de modelos de Demanda"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "pydantic>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pre-commit>=3.7",
]

[project.scripts]
pred-engine = "pred_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pred_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pred_engine --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src/pred_engine"]
omit = [
    "src/pred_engine/analisis/*",
    "src/pred_engine/optimizacion/*",
    "src/pred_engine/config/*",
    "src/pred_engine/ingesta/validador_tipo_archivo/*",
    "src/pred_engine/ingesta/categorizacion/*",
    "src/pred_engine/forecasting/control_reanudacion/*",
    "src/pred_engine/forecasting/evaluaciones/*",
    "src/pred_engine/forecasting/generador_pronosticos/*",
]

[tool.ruff]
src = ["src"]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
