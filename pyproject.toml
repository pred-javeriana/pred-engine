[project]
name = "pred-engine"
version = "0.1.0"
description = "PRED analytical engine: demand-forecasting library for Plataforma de Evaluacion y Recomendacion de modelos de Demanda"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pred_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pred_engine --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src/pred_engine"]

[tool.ruff]
src = ["src"]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
